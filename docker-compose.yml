name: tp2etp3

services:
  sivitDB:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sivit
      POSTGRES_DB: sivit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivit"]
      interval: 5s
      retries: 10

  portal:
    build: ./tp2etp3
    environment:
      DATABASE_URL: postgres://sivit:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD no .env}@sivitDB:5432/sivit
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?definir DJANGO_SECRET_KEY no .env}
    volumes:
      - static_volume:/app/static
    depends_on:
      sivitDB:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./tp2etp3/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static
    depends_on:
      - portal

volumes:
  db_data:
  static_volume: